name: Deploy Frontend

on:
  push:
    branches: [ main ] # O la rama que usen para producción

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Aquí agregas el paso de despliegue según el proveedor que utilices (por ejemplo, Vercel o Netlify CLI)